    fields: [Country, ParticipantName, Address, City, BIC, Readiness Date, Scheme Leaving Date, Scheme Options]
    format: CSV (comillas, coma)
    update_frequency: semanal (publicación automática desde la base de datos de participantes)
    auth: false
    subscription: false
    license: ATTRIBUTION_REQUIRED
    terms_url: https://www.europeanpaymentscouncil.eu/what-we-do/be-involved/register-participants/registers-participants-sepa-payment-schemes
    conditions: >-
      Se permite ver, descargar y poner a disposición los datos del registro. No pueden explotarse
      comercialmente como tales, en todo o en parte, salvo como parte de una oferta más amplia
      (nuestro caso: herramienta gratuita enriquecida con otras fuentes). Hay que citar al EPC como
      fuente, indicar si se han hecho cambios y no sugerir que el EPC respalda al usuario.
    attribution: "Fuente: European Payments Council (EPC), Register of Participants. Datos normalizados por Cryptopocket."
    commercial_reuse: solo como parte de una oferta más amplia
    public_display: true
    full_redistribution: false
