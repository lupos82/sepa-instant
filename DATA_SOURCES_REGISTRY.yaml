# Registro maestro de fuentes de datos — SEPA Tools 2.0 (Cryptopocket)
# El código lee este fichero: "publish: true" es la única forma de que los datos de una
# fuente lleguen a los ficheros públicos (data/v2). Cualquier fuente con licencia
# UNKNOWN / RESTRICTED / EXCLUDED se procesa como máximo para métricas internas.
#
# Estados de licencia:
#   VERIFIED_PUBLIC_USE   términos verificados que permiten uso público y comercial sin condiciones relevantes
#   ATTRIBUTION_REQUIRED  uso público permitido con atribución y condiciones (ver "conditions")
#   VERIFIED_INTERNAL_ONLY solo uso interno
#   UNKNOWN               fuente oficial accesible, términos de reutilización no verificados
#   RESTRICTED            requiere licencia, pago, registro o prohíbe la redistribución
#   EXCLUDED              no se usa (procedencia no oficial o incompatible)
#
# Última revisión de términos: 2026-10-28 (verificación documental hecha en esta fecha).

version: 1
last_review: "2026-10-28"
defaults:
  max_drop_ratio: 0.15        # bloquea la publicación si desaparece más de este % de registros
  min_records: 1
  retries: 3

sources:

