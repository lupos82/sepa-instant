  # ------------------------------------------------------------------ Bancos centrales con directorio verificado
  - id: bde_mfi_es
    institution: Banco de España
    countries: [ES]
    url: https://www.bde.es/webbe/es/estadisticas/otras-clasificaciones/clasificacion-entidades/listas-instituciones-financieras/listas-instituciones-financieras-monetarias-pais/lista-mfi-es.csv
    info_url: https://www.bde.es/webbe/es/estadisticas/otras-clasificaciones/clasificacion-entidades/listas-instituciones-financieras/listas-instituciones-financieras-monetarias-pais/lista-mfi-es.html
    type: national_mfi_list
    fields: [Código europeo, LEI, Nombre, Categoría, Dirección, Informe, Entidad matriz, Código supervisor]
    format: CSV
    update_frequency: diaria
    auth: false
    subscription: false
    license: ATTRIBUTION_REQUIRED
    terms_url: https://www.bde.es/wbe/en/estadisticas/recursos/terminos/terminos-de-uso.html
    conditions: >-
      Estadísticas de acceso y uso libre. Citar "Fuente: Elaboración propia a partir de datos de la web
      del Banco de España (www.bde.es)" e indicar la fecha de última actualización. Reproducción fiel,
      sin alterar los contenidos (aviso legal). Si se vendiera, informar de que es gratuita en bde.es.
    attribution: "Fuente: Elaboración propia a partir de datos de la web del Banco de España (www.bde.es)."
    commercial_reuse: permitido con atribución
    public_display: true
    full_redistribution: true
    relation_note: >-
      El "Código supervisor" de 4 dígitos es el código de entidad asignado por el Banco de España
      que figura en las posiciones 5-8 del IBAN español; el "Código europeo" (RIAD) es "ES" + ese
      código. Cobertura: instituciones financieras monetarias (entidades de crédito y banco central).
      No incluye entidades de pago ni de dinero electrónico.
    priority: 1
    publish: true
    min_records: 50
    connector: bde_mfi

  - id: bundesbank_blz
    institution: Deutsche Bundesbank
    countries: [DE]
    url: https://www.bundesbank.de/en/tasks/payment-systems/services/bank-sort-codes/download-bank-sort-codes-626218
    info_url: https://www.bundesbank.de/en/tasks/payment-systems/services/bank-sort-codes/download-bank-sort-codes-626218
    type: national_bank_code_directory
    fields: [Bankleitzahl, Merkmal, Bezeichnung, PLZ, Ort, Kurzbezeichnung, PAN, BIC, Prüfzifferberechnungsmethode, Datensatz-Nr., Änderungskennzeichen, Hinweis Löschung, Nachfolge-BLZ]
    format: TXT de ancho fijo (latin-1); también CSV y XML
    update_frequency: trimestral (lunes siguiente al primer sábado de marzo, junio, septiembre y diciembre); se comprueba cada día
    auth: false
    subscription: false
    license: ATTRIBUTION_REQUIRED
    terms_url: https://www.bundesbank.de/en/homepage/user-information/conditions-for-the-general-use-of-the-website-764706
    conditions: >-
      La información puede guardarse, reenviarse y reproducirse sin modificarla ni distorsionarla,
      citando "Source: Deutsche Bundesbank". La publicación en internet es "no vinculante"; el canal
      oficial para PSP es ExtraNet/NExt (no usado). Uso comercial del texto/datos no regulado de forma
      expresa: se recomienda revisión legal antes de campañas comerciales.
    attribution: "Source: Deutsche Bundesbank (Bankleitzahlendatei). Datos normalizados por Cryptopocket."
    commercial_reuse: no regulado expresamente
    public_display: true
    full_redistribution: false
    priority: 1
    publish: true
    min_records: 3000
    connector: bundesbank

