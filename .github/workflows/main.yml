name: Sincronizar EPC y publicar

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el ZIP subido
        run: for z in *.zip; do [ -f "$z" ] && unzip -n -j "$z"; done; ls -la

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y validar el registro del EPC
        continue-on-error: ${{ github.event_name == 'push' }}
        run: python sync_epc.py

      - name: Guardar los cambios en el repositorio
        run: |
          git config user.name "epc-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add participants.json changes.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el registro."
          else
            git commit -m "Registro EPC actualizado $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Preparar la web
        run: |
          mkdir -p _site
          cp index.html participants.json changes.json _site/
          cp status.json _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
